<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Relationship Triangle</title><desc id="d">USER and AI collaborate. Both interact with TASK-WORLD, which anchors judgment and execution in outcomes.</desc><rect width="1100" height="620" rx="20" fill="#142336"/><g font-family="Arial, sans-serif"><text x="50" y="60" fill="#83dec7" font-size="20" letter-spacing="3">THE RELATIONSHIP TRIANGLE</text><g stroke="#6fa4ac" stroke-width="3"><path d="M290 215 L810 215 M260 255 L460 450 M840 255 L640 450"/></g><g fill="#233e4d" stroke="#5b8e99"><rect x="70" y="135" width="300" height="120" rx="15"/><rect x="730" y="135" width="300" height="120" rx="15"/><rect x="375" y="435" width="350" height="125" rx="15"/></g><g text-anchor="middle" fill="white" font-size="29" font-weight="bold"><text x="220" y="180">USER</text><text x="880" y="180">AI</text><text x="550" y="480">TASK-WORLD</text></g><g text-anchor="middle" fill="#d0ddea" font-size="18"><text x="220" y="219">Strengths · Intent · Preferences</text><text x="880" y="219">Capabilities · Tools · Behavior</text><text x="550" y="519">Demands · Constraints · Outcomes</text><text x="550" y="166">Feedback</text><text x="550" y="193">Complementary roles</text><text x="229" y="342">Judgment +</text><text x="229" y="369">outcome evidence</text><text x="875" y="342">Execution +</text><text x="875" y="369">verification</text></g><text x="550" y="600" text-anchor="middle" fill="#83dec7" font-size="18">The task-world anchors both partners in observable outcomes.</text></g></svg>
